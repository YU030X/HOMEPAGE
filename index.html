<!doctype html>
<html lang="en">

  <meta name="color-scheme" content="dark light" />

  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='9' fill='none' stroke='%238a8a86' stroke-width='2.5'/></svg>" />
  <title>YU030X - Signal Chamber</title>
  <script>
    // Resolve the theme before first paint so the page never flashes the wrong one.
    (() => {
      let stored = null;

      try {
        stored = localStorage.getItem("yu030x-theme");
      } catch (error) {
        stored = null;
      }

      const prefersLight = window.matchMedia("(prefers-color-scheme: light)").matches;
      document.documentElement.dataset.theme =
        stored === "paper" || stored === "dark" ? stored : (prefersLight ? "paper" : "dark");
    })();
  </script>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="noise" aria-hidden="true"></div>

        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to paper theme">

          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.4 13.6A8.4 8.4 0 0 1 10.4 3.6 8.4 8.4 0 1 0 20.4 13.6Z" />
          </svg>
        </button>
